# ============================================================
#  FutureCandle — Auto Deploy on Commit
#  Triggers on every push to main
#  Builds Docker image & deploys to GitHub Container Registry
#  Optionally deploys to any server via SSH
# ============================================================
name: 🚀 Deploy on Commit

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: futurecandle
  REGISTRY: ghcr.io

jobs:
  # ---- Build & Push Docker Image ----
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: 🏗️ Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Image Published
        run: echo "✅ Published ${{ steps.meta.outputs.tags }}"

  # ---- Deploy to Server via SSH (optional) ----
  deploy-server:
    name: 🖥️ Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    # Uncomment and configure when ready:
    # environment: production
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ---- Option A: Deploy via SSH ----
      # Uncomment below and add SSH_PRIVATE_KEY + HOST secrets
      #
      # - name: 🔐 Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /opt/futurecandle
      #       git pull origin main
      #       docker compose up -d --build
      #       echo "✅ FutureCandle updated & restarted"

      # ---- Option B: Deploy to any VPS with Docker ----
      # Add DEPLOY_HOST, DEPLOY_USER, SSH_PRIVATE_KEY to repo secrets
      #
      # - name: 🐳 Remote Docker Deploy
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       docker pull ghcr.io/${{ github.repository }}:latest
      #       docker stop futurecandle || true
      #       docker rm futurecandle || true
      #       docker run -d --name futurecandle -p 5000:5000 --restart unless-stopped \
      #         ghcr.io/${{ github.repository }}:latest

      - name: 📋 Deployment Info
        run: |
          echo "================================================"
          echo "  FutureCandle — Deploy Pipeline Ready"
          echo "================================================"
          echo ""
          echo "  To enable auto-deploy to your server:"
          echo ""
          echo "  1. Go to: Settings → Secrets → Actions"
          echo "  2. Add these secrets:"
          echo "     DEPLOY_HOST   = your-server-ip"
          echo "     DEPLOY_USER   = ssh-username"
          echo "     SSH_PRIVATE_KEY = your-ssh-private-key"
          echo ""
          echo "  3. Uncomment the deploy step in .github/workflows/deploy.yml"
          echo ""
          echo "  Docker image: ghcr.io/${{ github.repository }}:latest"
          echo "================================================"

  # ---- Notify on Success ----
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-server]
    if: always()
    steps:
      - name: 📢 Summary
        run: |
          echo "## 🚀 FutureCandle Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy:** ${{ needs.deploy-server.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Deploy Command:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 5000:5000 --name futurecandle ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY